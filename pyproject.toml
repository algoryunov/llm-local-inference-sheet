[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "llm-local-inference-sheet"
version = "0.1.0"
description = "Reproducible LLM serving benchmarks for Apple Silicon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Core harness: config validation, async HTTP client, telemetry, reports.
# Deliberately free of torch/mlx so it runs on any host.
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "httpx>=0.27,<1",
  "psutil>=5.9",
]

[project.optional-dependencies]
# Offline workload building with each model's pinned tokenizer + chat template.
workloads = [
  "transformers>=4.56",
  "jinja2>=3.1",
  "huggingface_hub>=0.34",
]
# Proofreading evaluation: ERRANT (standard GEC edit scorer) + its spaCy English model, pyarrow for JFLEG parquet.
proofread = [
  "errant==3.0.2",
  "pyarrow>=15",
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "types-psutil",
]

[project.scripts]
llm-sheet = "llm_local_inference_sheet.cli:main"

[tool.hatch.metadata]
# The `proofread` extra pins spaCy's English model by its release URL (not on PyPI).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/llm_local_inference_sheet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: opt-in tests against real installed backends (set LLM_SHEET_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"  # numpy stubs use 3.12 syntax; runtime still supports 3.11
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
