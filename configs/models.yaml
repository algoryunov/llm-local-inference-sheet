# with scripts/resolve_hf_artifacts.py. They are pinned commits, never mutable tags.
# `chat_template_sha256` is sha256 of the effective HF chat template at the pinned
# tokenizer revision (chat_template.jinja if present, else tokenizer_config.json).
# GGUF files embed their own template, which is checked at runtime (see `llm-sheet provenance`).
#
# Runtime compatibility statuses:
#   verified    : a measured run in results/ succeeded with this exact artifact
#   expected    : format documented as supported by the runtime; not yet run here
#   attempt     : outside the runtime's documented support matrix; worth trying, label results
#   unsupported : documented or observed not to work
#   untested    : no evidence either way
# Unknown values are written as null, never guessed.
